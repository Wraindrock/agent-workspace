# ---------------------------------------------------------------------------
# Build, self-test and publish the agent-workspace image.
#
#   pull request   -> lint + build + container self test (never pushes)
#   push to main   -> the above, then push and cosign-sign the image
#   push to dev    -> the above, but NEVER pushes an image (see below)
#   nightly        -> rebuild against the freshest base image
#
# main is not "stable" and dev is not "unstable" in any semver sense: both are
# moving branches, and dev is simply where work lands before it is reviewed onto
# main. The one thing that must not drift is which branch owns the published
# tags - `latest` and `previous` are mutable pointers that users pull, so only
# main may write them. Publishing from dev would silently replace the image a
# user's next `install.sh upgrade` picks up, which is exactly the "never
# overwrite a published tag" rule this project holds itself to. Every publish
# step below is therefore gated on `github.ref == 'refs/heads/main'` rather than
# on `event_name != 'pull_request'`, which was true for *any* branch push.
#
# The same steps are available locally as `just check`, `just build` and
# `just smoke`; this workflow deliberately uses plain podman so that CI has
# one less moving part than a developer machine.
# ---------------------------------------------------------------------------
name: build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    # rebuild every night so the image tracks security fixes in the base image
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read image metadata from image.env
        id: meta
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./image.env
          registry="$(printf '%s' "${IMAGE_REGISTRY:-${{ env.IMAGE_REGISTRY }}}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image_name=${IMAGE_NAME}"
            echo "default_tag=${DEFAULT_TAG}"
            echo "base_image=${BASE_IMAGE}"
            echo "agent_user=${AGENT_USER}"
            # The Justfile reads the same image.env for its labels, so the image CI
            # publishes carries exactly the labels a local `just build` produces.
            echo "image_desc=${IMAGE_DESC}"
            echo "image_license=${IMAGE_LICENSE}"
            echo "image_logo_url=${IMAGE_LOGO_URL}"
            echo "registry=${registry}"
            echo "registry_host=${registry%%/*}"
            echo "image=${registry}/${IMAGE_NAME}"
            echo "local_image=localhost/${IMAGE_NAME}"
            echo "date_tag=$(date -u +%Y%m%d)"
            echo "git_sha=$(git rev-parse --short HEAD)"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Install actionlint
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/actionlint" --version

      - name: Install just
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/just.tar.gz \
            https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/just.tar.gz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - name: Lint
        run: bash tests/lint.sh

      # The installer tests fake podman/docker, so they need no engine, no root
      # and no network - and install.sh is the only supported entry point, so it
      # is the last thing that should go untested on a pull request.
      - name: Installer integration tests
        run: bash tests/install.sh

      - name: Build image
        env:
          LOCAL_IMAGE: ${{ steps.meta.outputs.local_image }}
          TAG: ${{ steps.meta.outputs.default_tag }}
        run: |
          set -euo pipefail
          podman build \
            --pull=newer \
            --build-arg "BASE_IMAGE=${{ steps.meta.outputs.base_image }}" \
            --build-arg "IMAGE_NAME=${{ steps.meta.outputs.image_name }}" \
            --build-arg "IMAGE_REGISTRY=${{ steps.meta.outputs.registry }}" \
            --build-arg "IMAGE_VERSION=${TAG}" \
            --build-arg "GIT_SHA=${{ steps.meta.outputs.git_sha }}" \
            --build-arg "BUILD_DATE=${{ steps.meta.outputs.build_date }}" \
            --build-arg "AGENT_USER=${{ steps.meta.outputs.agent_user }}" \
            --label "org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --label "org.opencontainers.image.revision=${{ steps.meta.outputs.git_sha }}" \
            --label "org.opencontainers.image.description=${{ steps.meta.outputs.image_desc }}" \
            --label "org.opencontainers.image.licenses=${{ steps.meta.outputs.image_license }}" \
            --label "io.artifacthub.package.logo-url=${{ steps.meta.outputs.image_logo_url }}" \
            --tag "${LOCAL_IMAGE}:${TAG}" \
            --file Containerfile \
            .
          podman images --filter "reference=${LOCAL_IMAGE}"

      - name: Container self test
        env:
          LOCAL_IMAGE: ${{ steps.meta.outputs.local_image }}
          TAG: ${{ steps.meta.outputs.default_tag }}
        run: bash tests/smoke.sh "${LOCAL_IMAGE}:${TAG}"

      - name: Fail on bootc lint regressions
        env:
          LOCAL_IMAGE: ${{ steps.meta.outputs.local_image }}
          TAG: ${{ steps.meta.outputs.default_tag }}
        run: |
          set -euo pipefail
          podman run --rm --entrypoint /usr/bin/bootc "${LOCAL_IMAGE}:${TAG}" container lint \
            | tee /tmp/bootc-lint.txt
          # `bootc container lint` reports warnings without failing the command.
          # Runtime-only content is not advisory for us: /run has to be empty in
          # the image, otherwise the image ships build junk that nothing cleans up.
          if grep -q 'nonempty-run-tmp' /tmp/bootc-lint.txt; then
            echo "::error::bootc container lint found content in /run (nonempty-run-tmp)"
            exit 1
          fi

      # The installer tests fake the engine and the self test overrides the image
      # command, so this is the only check that proves install.sh can boot the
      # image that was just built.
      - name: Installer end-to-end test
        env:
          LOCAL_IMAGE: ${{ steps.meta.outputs.local_image }}
          TAG: ${{ steps.meta.outputs.default_tag }}
        run: bash tests/integration.sh "${LOCAL_IMAGE}:${TAG}"

      # Proof that the image is portable rather than dependent on a tuned host:
      # PID 1 has to come up as systemd, and the run records the runner's
      # inotify budget instead of demanding a particular value. Runs after
      # integration because the two share the engine.
      - name: Host-decoupling portability test
        env:
          LOCAL_IMAGE: ${{ steps.meta.outputs.local_image }}
          TAG: ${{ steps.meta.outputs.default_tag }}
        run: bash tests/portability.sh "${LOCAL_IMAGE}:${TAG}"

      # Behavioural half of the P0 decoupling contract: the sysctl drop-in stays
      # deleted and the assertions that guard it still have a failing branch.
      # No engine and no privileges needed, so it cannot be skipped by a runner
      # without rootless podman.
      - name: Host-tuning decoupling assertions
        run: bash tests/decoupling.sh

      # The declared compatibility surface - config/*.conf, image.env, install.sh
      # and the agent-workspace CLI. Static and CLI-level, so like the decoupling
      # assertions it needs no engine, no root and no network; it is what fails
      # when a pull request changes the public surface without saying so.
      - name: Compatibility surface contract
        run: bash tests/contract.sh

      # firstboot provisioning is idempotent and survives a uid its user
      # namespace cannot name. The completion marker, the unit's guard and the
      # column order of /proc/self/uid_map are all text-level, so this needs no
      # engine either - a regression here is invisible until a user's container
      # re-provisions itself on every boot.
      - name: firstboot provisioning contract
        run: bash tests/firstboot.sh

      # install.sh is the documented install path, and `curl | bash` gives it no
      # checkout to fall back on: it downloads installer/lib/* and image.env and
      # checks them against digests carried inside the script itself. This asserts
      # the stamp still matches the tree and that a file whose bytes do not match
      # is refused rather than warned about. No engine, no network.
      - name: curl | bash bootstrap contract
        run: bash tests/bootstrap.sh

      # The interface follows the user's locale, and the TUI dispatches on a stable
      # key rather than on the label it is showing. Both are invisible in English: a
      # translated menu whose dispatch matched on the text would draw perfectly and
      # then do nothing at all. No engine.
      - name: interface language contract
        run: bash tests/i18n.sh

      # The Incus backend speaks a different CLI than the container-CLI backends
      # and one of its verbs imports a rootfs into a daemon, so it gets its own
      # fake-daemon test: nothing here needs incus, root or a network.
      - name: incus backend contract
        run: bash tests/incus.sh

      # ------------------------------------------------------------------
      # Everything below only runs for a merged or scheduled build.
      # ------------------------------------------------------------------
      - name: Log in to the container registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          # Podman push/pull below pass --authfile explicitly, so the credentials never
          # depend on where the default credential store happens to live.
          AUTHFILE: ${{ runner.temp }}/auth.json
          # cosign (a go-containerregistry client) reads the Docker config, so keep a
          # second copy of the same credentials in the format that client expects.
          DOCKER_AUTHFILE: ${{ runner.temp }}/docker-config/config.json
        run: |
          set -euo pipefail
          registry_host="${{ steps.meta.outputs.registry_host }}"
          mkdir -p "$(dirname "${DOCKER_AUTHFILE}")"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            podman login "${registry_host}" -u "${{ github.actor }}" --password-stdin \
              --authfile "${AUTHFILE}"
          cp "${AUTHFILE}" "${DOCKER_AUTHFILE}"
          # keep podman's default store populated too, so a command that forgets
          # --authfile still authenticates instead of quietly pushing anonymously
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            podman login "${registry_host}" -u "${{ github.actor }}" --password-stdin

      - name: Preserve the currently published image as :previous
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.default_tag }}
          AUTHFILE: ${{ runner.temp }}/auth.json
        run: |
          set -euo pipefail
          if podman pull --authfile "${AUTHFILE}" "${IMAGE}:${TAG}"; then
            podman tag "${IMAGE}:${TAG}" "${IMAGE}:previous"
            podman push --authfile "${AUTHFILE}" "${IMAGE}:previous"
            echo "tagged the outgoing release as :previous"
          else
            echo "no published image yet, nothing to preserve"
          fi

      - name: Tag this build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          LOCAL_IMAGE: ${{ steps.meta.outputs.local_image }}
          TAG: ${{ steps.meta.outputs.default_tag }}
          DATE_TAG: ${{ steps.meta.outputs.date_tag }}
          GIT_SHA: ${{ steps.meta.outputs.git_sha }}
        run: |
          set -euo pipefail
          image_id="$(podman image inspect "${LOCAL_IMAGE}:${TAG}" --format '{{.Id}}')"
          tags=(
            "${TAG}"
            "${DATE_TAG}"
            "${TAG}-${DATE_TAG}"
            "${DATE_TAG}-${GIT_SHA}"
          )
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tags+=("${TAG}-${GIT_SHA}")
          fi
          for tag in "${tags[@]}"; do
            podman tag "$image_id" "${IMAGE}:${tag}"
          done
          printf '%s\n' "${tags[@]}" > "$RUNNER_TEMP/tags.txt"
          cat "$RUNNER_TEMP/tags.txt"

      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          AUTHFILE: ${{ runner.temp }}/auth.json
        run: |
          set -euo pipefail
          # The login step wrote the credentials to ${AUTHFILE}; pass it explicitly so
          # that neither a stray DOCKER_CONFIG nor an empty default store can turn this
          # into an anonymous push (which ghcr.io rejects with 403 while minting a token).
          push() {
            local tag="$1" attempt
            for attempt in 1 2 3; do
              if podman push --authfile "${AUTHFILE}" \
                --digestfile "$RUNNER_TEMP/podman-digest" "${IMAGE}:${tag}"; then
                return 0
              fi
              echo "push of ${tag} failed on attempt ${attempt}, retrying in 15s"
              sleep 15
            done
            echo "push of ${tag} failed after 3 attempts"
            return 1
          }
          while read -r tag; do
            [[ -n "$tag" ]] || continue
            push "$tag"
          done < "$RUNNER_TEMP/tags.txt"

      - name: Resolve the published digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: published
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.default_tag }}
          REGISTRY_HOST: ${{ steps.meta.outputs.registry_host }}
          AUTHFILE: ${{ runner.temp }}/auth.json
        run: |
          set -euo pipefail
          # Ask the registry which manifest the tag now holds. cosign has to sign that
          # digest: a locally computed one (podman image inspect, RepoDigests) can differ
          # from the manifest the registry actually stored, and then verification looks
          # for a signature that was never created.
          repo_path="${IMAGE#"${REGISTRY_HOST}"/}"
          basic="$(jq -r --arg host "${REGISTRY_HOST}" '.auths[$host].auth' "${AUTHFILE}")"
          token="$(curl -fsS -H "Authorization: Basic ${basic}" \
            "https://${REGISTRY_HOST}/token?scope=repository:${repo_path}:pull&service=${REGISTRY_HOST}" \
            | jq -r '.token')"
          digest="$(curl -fsSI \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://${REGISTRY_HOST}/v2/${repo_path}/manifests/${TAG}" \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }')"
          if [[ -z "${digest}" ]]; then
            echo "the registry reported no digest for ${IMAGE}:${TAG}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${IMAGE}:${TAG} as ${digest}"
          if [[ -s "$RUNNER_TEMP/podman-digest" ]]; then
            echo "podman reported $(cat "$RUNNER_TEMP/podman-digest")"
          fi

      - name: Install cosign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3
        with:
          # pinned: the legacy sha256-<digest>.sig layout below is what cosign 2.x writes
          cosign-release: v2.5.2

      - name: Sign the published image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.published.outputs.digest }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: |
          set -euo pipefail
          target="${IMAGE}@${DIGEST}"
          echo "signing ${target}"
          if [[ -n "${SIGNING_SECRET}" ]]; then
            printf '%s' "${SIGNING_SECRET}" > "$RUNNER_TEMP/cosign.key"
            cosign sign --yes --key "$RUNNER_TEMP/cosign.key" "${target}"
            rm -f "$RUNNER_TEMP/cosign.key"
          else
            # keyless: the workflow's OIDC identity is the verification anchor
            cosign sign --yes "${target}"
          fi

      - name: Verify the published signature
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.published.outputs.digest }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: |
          set -euo pipefail
          if [[ -n "${SIGNING_SECRET}" ]]; then
            echo "key-signed image: verify it with the matching public key (see scripts/cosign-keygen.sh)"
            exit 0
          fi
          cosign verify \
            --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
