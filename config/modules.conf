# ---------------------------------------------------------------------------
# Declarative module selection.
#
#   <module-dir>=1   apply the module
#   <module-dir>=0   skip the module
#
# Modules not listed here use their MODULE_ENABLED_DEFAULT from module.env.
# A single build can override this file entirely with
#   --build-arg IMAGE_MODULES="10-base-packages,30-agent-toolchains"
# IMAGE_MODULES=all means "follow this file".
#
# Modules run in lexical order, so numbering is the execution order contract.
# ---------------------------------------------------------------------------

00-preflight=1
10-base-packages=1
20-container-tools=1
30-agent-toolchains=1
40-agent-harnesses=1
50-devtools=1
60-system-config=1
80-manifest=1
90-cleanup=1
