# ---------------------------------------------------------------------------
# Declarative agent harness selection.
#
#   <recipe>=1   install this agent in the image
#   <recipe>=0   leave it out
#
# Recipes live in build_files/modules/40-agent-harnesses/agents/<recipe>.sh
# and must define AGENT_BINARIES plus install_agent(). A single build can
# override this file with
#   --build-arg AGENTS="claude-code,codex"
# AGENTS=all means "follow this file".
#
# The host installer (install.sh) offers exactly the agents enabled here to
# the containers it creates, so this list is also the user-facing menu.
# ---------------------------------------------------------------------------

dsh=1
opencode=1

# Available recipes that are not baked into the default image. Flip one to 1
# (or build once with --build-arg AGENTS=dsh,opencode,codex) to add it.
claude-code=0
codex=0
gemini-cli=0
aider=0
