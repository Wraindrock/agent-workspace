# ---------------------------------------------------------------------------
# Build installable disk images (qcow2 / raw / Anaconda ISO) from a published
# agent-workspace image with bootc-image-builder.
#
# These are large and slow, so they are built on demand or monthly rather than
# on every commit. Download the result from the workflow run's artifacts.
# ---------------------------------------------------------------------------
name: build-disk

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to turn into a disk image"
        required: true
        default: latest
      type:
        description: "Disk image type"
        required: true
        default: qcow2
        type: choice
        options:
          - qcow2
          - raw
          - anaconda-iso
  schedule:
    - cron: "0 6 1 * *"

concurrency:
  group: build-disk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disk:
    name: build disk image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read image metadata
        id: meta
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./image.env
          registry="$(echo "${IMAGE_REGISTRY:-${{ github.repository_owner }}}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "registry=${registry%%/*}"
            echo "image=${registry}/${IMAGE_NAME}"
            echo "bib_image=${BIB_IMAGE}"
            echo "tag=${{ github.event.inputs.tag || 'latest' }}"
            echo "type=${{ github.event.inputs.type || 'qcow2' }}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            sudo podman login "${{ steps.meta.outputs.registry }}" -u "${{ github.actor }}" --password-stdin || true

      - name: Pull the image
        run: sudo podman pull "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

      - name: Build the disk image
        run: |
          set -euo pipefail
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            --volume "$PWD/output:/output" \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume "$PWD/disk_config/disk.toml:/disk.toml:ro" \
            "${{ steps.meta.outputs.bib_image }}" \
            --type "${{ steps.meta.outputs.type }}" \
            --use-librepo=True \
            --rootfs btrfs \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          sudo chown -R "$(id -u):$(id -g)" output
          ls -lh output

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: agent-workspace-${{ steps.meta.outputs.type }}-${{ steps.meta.outputs.tag }}
          path: output/**
          if-no-files-found: error
          retention-days: 14
