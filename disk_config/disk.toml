# bootc-image-builder disk layout for installable images.
# Adjust min sizes to your workload; agents pull large images and keep model
# and package caches, so give /var room to grow.

[[customizations.filesystem]]
mountpoint = "/"
minsize = "20 GiB"

# Uncomment for a separate /var (recommended for hosts that run many agents).
# [[customizations.filesystem]]
# mountpoint = "/var"
# minsize = "50 GiB"
