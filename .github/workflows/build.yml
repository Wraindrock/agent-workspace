# ---------------------------------------------------------------------------
# Build, self-test and publish the agent-workspace image.
#
#   pull request -> lint + build + container self test (never pushes)
#   push to main -> the above, then push and cosign-sign the image
#   nightly      -> rebuild against the freshest base image
#
# The same steps are available locally as `just check`, `just build` and
# `just smoke`; this workflow deliberately uses plain podman so that CI has
# one less moving part than a developer machine.
# ---------------------------------------------------------------------------
name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # rebuild every night so the image tracks security fixes in the base image
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read image metadata from image.env
        id: meta
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./image.env
          registry="$(printf '%s' "${IMAGE_REGISTRY:-${{ env.IMAGE_REGISTRY }}}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image_name=${IMAGE_NAME}"
            echo "default_tag=${DEFAULT_TAG}"
            echo "base_image=${BASE_IMAGE}"
            echo "agent_user=${AGENT_USER}"
            echo "registry=${registry}"
            echo "registry_host=${registry%%/*}"
            echo "image=${registry}/${IMAGE_NAME}"
            echo "local_image=localhost/${IMAGE_NAME}"
            echo "date_tag=$(date -u +%Y%m%d)"
            echo "git_sha=$(git rev-parse --short HEAD)"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Install actionlint
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/actionlint" --version

      - name: Install just
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/just.tar.gz \
            https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/just.tar.gz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - name: Lint
        run: bash tests/lint.sh

      - name: Build image
        env:
          LOCAL_IMAGE: ${{ steps.meta.outputs.local_image }}
          TAG: ${{ steps.meta.outputs.default_tag }}
        run: |
          set -euo pipefail
          podman build \
            --pull=newer \
            --build-arg "BASE_IMAGE=${{ steps.meta.outputs.base_image }}" \
            --build-arg "IMAGE_NAME=${{ steps.meta.outputs.image_name }}" \
            --build-arg "IMAGE_REGISTRY=${{ steps.meta.outputs.registry }}" \
            --build-arg "IMAGE_VERSION=${TAG}" \
            --build-arg "GIT_SHA=${{ steps.meta.outputs.git_sha }}" \
            --build-arg "BUILD_DATE=${{ steps.meta.outputs.build_date }}" \
            --build-arg "AGENT_USER=${{ steps.meta.outputs.agent_user }}" \
            --label "org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}" \
            --label "org.opencontainers.image.version=${{ steps.meta.outputs.git_sha }}" \
            --label "org.opencontainers.image.revision=${{ steps.meta.outputs.git_sha }}" \
            --tag "${LOCAL_IMAGE}:${TAG}" \
            --file Containerfile \
            .
          podman images --filter "reference=${LOCAL_IMAGE}"

      - name: Container self test
        env:
          LOCAL_IMAGE: ${{ steps.meta.outputs.local_image }}
          TAG: ${{ steps.meta.outputs.default_tag }}
        run: bash tests/smoke.sh "${LOCAL_IMAGE}:${TAG}"

      - name: Fail on bootc lint regressions
        env:
          LOCAL_IMAGE: ${{ steps.meta.outputs.local_image }}
          TAG: ${{ steps.meta.outputs.default_tag }}
        run: podman run --rm --entrypoint /usr/bin/bootc "${LOCAL_IMAGE}:${TAG}" container lint

      # ------------------------------------------------------------------
      # Everything below only runs for a merged or scheduled build.
      # ------------------------------------------------------------------
      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        env:
          # Podman push/pull below pass --authfile explicitly, so the credentials never
          # depend on where the default credential store happens to live.
          AUTHFILE: ${{ runner.temp }}/auth.json
          # cosign (a go-containerregistry client) reads the Docker config, so keep a
          # second copy of the same credentials in the format that client expects.
          DOCKER_AUTHFILE: ${{ runner.temp }}/docker-config/config.json
        run: |
          set -euo pipefail
          registry_host="${{ steps.meta.outputs.registry_host }}"
          mkdir -p "$(dirname "${DOCKER_AUTHFILE}")"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            podman login "${registry_host}" -u "${{ github.actor }}" --password-stdin \
              --authfile "${AUTHFILE}"
          cp "${AUTHFILE}" "${DOCKER_AUTHFILE}"
          # keep podman's default store populated too, so a command that forgets
          # --authfile still authenticates instead of quietly pushing anonymously
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            podman login "${registry_host}" -u "${{ github.actor }}" --password-stdin

      - name: Preserve the currently published image as :previous
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.default_tag }}
          AUTHFILE: ${{ runner.temp }}/auth.json
        run: |
          set -euo pipefail
          if podman pull --authfile "${AUTHFILE}" "${IMAGE}:${TAG}"; then
            podman tag "${IMAGE}:${TAG}" "${IMAGE}:previous"
            podman push --authfile "${AUTHFILE}" "${IMAGE}:previous"
            echo "tagged the outgoing release as :previous"
          else
            echo "no published image yet, nothing to preserve"
          fi

      - name: Tag this build
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          LOCAL_IMAGE: ${{ steps.meta.outputs.local_image }}
          TAG: ${{ steps.meta.outputs.default_tag }}
          DATE_TAG: ${{ steps.meta.outputs.date_tag }}
          GIT_SHA: ${{ steps.meta.outputs.git_sha }}
        run: |
          set -euo pipefail
          image_id="$(podman image inspect "${LOCAL_IMAGE}:${TAG}" --format '{{.Id}}')"
          tags=(
            "${TAG}"
            "${DATE_TAG}"
            "${TAG}-${DATE_TAG}"
            "${DATE_TAG}-${GIT_SHA}"
          )
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tags+=("${TAG}-${GIT_SHA}")
          fi
          for tag in "${tags[@]}"; do
            podman tag "$image_id" "${IMAGE}:${tag}"
          done
          printf '%s\n' "${tags[@]}" > "$RUNNER_TEMP/tags.txt"
          cat "$RUNNER_TEMP/tags.txt"

      - name: Push
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          AUTHFILE: ${{ runner.temp }}/auth.json
        run: |
          set -euo pipefail
          # The login step wrote the credentials to ${AUTHFILE}; pass it explicitly so
          # that neither a stray DOCKER_CONFIG nor an empty default store can turn this
          # into an anonymous push (which ghcr.io rejects with 403 while minting a token).
          push() {
            local tag="$1" attempt
            for attempt in 1 2 3; do
              if podman push --authfile "${AUTHFILE}" \
                --digestfile "$RUNNER_TEMP/podman-digest" "${IMAGE}:${tag}"; then
                return 0
              fi
              echo "push of ${tag} failed on attempt ${attempt}, retrying in 15s"
              sleep 15
            done
            echo "push of ${tag} failed after 3 attempts"
            return 1
          }
          while read -r tag; do
            [[ -n "$tag" ]] || continue
            push "$tag"
          done < "$RUNNER_TEMP/tags.txt"

      - name: Resolve the published digest
        if: github.event_name != 'pull_request'
        id: published
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.default_tag }}
          REGISTRY_HOST: ${{ steps.meta.outputs.registry_host }}
          AUTHFILE: ${{ runner.temp }}/auth.json
        run: |
          set -euo pipefail
          # Ask the registry which manifest the tag now holds. cosign has to sign that
          # digest: a locally computed one (podman image inspect, RepoDigests) can differ
          # from the manifest the registry actually stored, and then verification looks
          # for a signature that was never created.
          repo_path="${IMAGE#"${REGISTRY_HOST}"/}"
          basic="$(jq -r --arg host "${REGISTRY_HOST}" '.auths[$host].auth' "${AUTHFILE}")"
          token="$(curl -fsS -H "Authorization: Basic ${basic}" \
            "https://${REGISTRY_HOST}/token?scope=repository:${repo_path}:pull&service=${REGISTRY_HOST}" \
            | jq -r '.token')"
          digest="$(curl -fsSI \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://${REGISTRY_HOST}/v2/${repo_path}/manifests/${TAG}" \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }')"
          if [[ -z "${digest}" ]]; then
            echo "the registry reported no digest for ${IMAGE}:${TAG}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${IMAGE}:${TAG} as ${digest}"
          if [[ -s "$RUNNER_TEMP/podman-digest" ]]; then
            echo "podman reported $(cat "$RUNNER_TEMP/podman-digest")"
          fi

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          # pinned: the legacy sha256-<digest>.sig layout below is what cosign 2.x writes
          cosign-release: v2.5.2

      - name: Sign the published image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.published.outputs.digest }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: |
          set -euo pipefail
          target="${IMAGE}@${DIGEST}"
          echo "signing ${target}"
          if [[ -n "${SIGNING_SECRET}" ]]; then
            printf '%s' "${SIGNING_SECRET}" > "$RUNNER_TEMP/cosign.key"
            cosign sign --yes --key "$RUNNER_TEMP/cosign.key" "${target}"
            rm -f "$RUNNER_TEMP/cosign.key"
          else
            # keyless: the workflow's OIDC identity is the verification anchor
            cosign sign --yes "${target}"
          fi

      - name: Verify the published signature
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.published.outputs.digest }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: |
          set -euo pipefail
          if [[ -n "${SIGNING_SECRET}" ]]; then
            echo "key-signed image: verify it with the matching public key (see scripts/cosign-keygen.sh)"
            exit 0
          fi
          cosign verify \
            --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
