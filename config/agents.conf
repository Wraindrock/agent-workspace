# ---------------------------------------------------------------------------
# Declarative agent harness selection.
#
#   <recipe>=1   install this agent in the image
#   <recipe>=0   leave it out
#
# Recipes live in build_files/modules/40-agent-harnesses/agents/<recipe>.sh
# and must define AGENT_BINARIES plus install_agent(). A single build can
# override this file with
#   --build-arg AGENTS="claude-code,codex"
# AGENTS=all means "follow this file".
# ---------------------------------------------------------------------------

claude-code=1
codex=1
gemini-cli=1
opencode=0
aider=0
